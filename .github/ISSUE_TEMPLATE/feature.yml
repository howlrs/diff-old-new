name: Feature
description: 新機能の Issue
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: |
        ### Feature Issue
        v3 design doc (`docs/specs/2026-05-04-v3-design.md`) の該当節を参照しながら起票してください。
  - type: input
    id: layer
    attributes:
      label: Layer
      description: L1 / L2 / L3 / cross-cutting のどれか
      placeholder: "L1"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 何を作るか (1-3 行)
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: なぜ必要か (KPI / 戦略 / アーキ要件への参照)
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: 完了条件 (チェックリスト形式)
      value: |
        - [ ] コード: ruff/mypy エラー 0
        - [ ] テスト: pytest pass、新規ロジックは coverage ≥ 80%
        - [ ] ドキュメント: 関数 docstring + 該当 spec / KPI への参照
        - [ ] 動作確認: 想定入力で期待出力が出る (実データ or fixture)
        - [ ] Gemini レビュー: code review 通し、指摘 close
        - [ ] PR: develop へ PR、レビュー後 squash merge
        - [ ] SurrealDB 記録: 該当層の知見を knowledge or output_log に保存
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / 関連 Issue
      description: 関連 Issue / リスク / 補足
