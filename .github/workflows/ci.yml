name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python:
    name: python (lint + type + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # "all" は機能 extras (gui/audit/...) をまとめた meta extra.
        # extras 追加時は pyproject.toml の "all" にも必ず反映すること.
        # Gemini partner レビュー (2026-05-04) で推奨されたデファクト構成.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src
        continue-on-error: true  # Phase 1: warning として記録, Phase 2 で strict 必須化

      # PR-C4 (2026-05-05): the slow-marked Python e2e tests in
      # tests/test_executor_client_live.py spawn the Rust executor-server
      # in mock mode. Build it (release profile) once before pytest so the
      # `running_server` fixture finds the binary.
      - name: Install Rust toolchain (for e2e binary)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (e2e build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            executor/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('executor/Cargo.lock', 'executor/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Build executor-server (release) for e2e
        working-directory: executor
        run: cargo build --release -p executor-server

      - name: Pytest (incl. mock e2e via executor-server)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q -m "not live" --cov=src --cov-report=term-missing

  rust:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            executor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('executor/Cargo.lock', 'executor/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # NOTE: --all-features intentionally avoided. The executor-hl `live`
        # feature hits real Hyperliquid mainnet /info and would burn rate
        # limit / leak the test EOA in CI logs. Run `cargo test -p executor-hl
        # --features live` locally with HL_TEST_ADDRESS set when needed.
        run: cargo test --workspace
