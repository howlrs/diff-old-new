[project]
name = "diff-old-new"
version = "0.1.0"
description = "Old/New 金融の構造的差分を活用した、繰り返し可能な統計的優位の発見"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "howlrs", email = "sharebook.amazon@gmail.com" },
]
keywords = ["hyperliquid", "perpetuals", "trade-xyz", "statistical-arbitrage", "quant"]

# 全て 2026-05-04 時点の最新版を採用 (パッケージは ~= で minor 緩和)
dependencies = [
    # Hyperliquid
    "hyperliquid-python-sdk~=0.23.0",
    "websockets~=16.0",
    "httpx~=0.28.1",
    # Data
    "polars~=1.40.1",
    "duckdb~=1.5.2",
    "pyarrow~=24.0.0",
    # Numerics / stats
    "numpy~=2.4.4",
    "scipy~=1.17.1",
    # Config / logging
    "pydantic~=2.13.3",
    "pydantic-settings~=2.14.0",
    "pyyaml~=6.0.3",
    "structlog~=25.5.0",
    # CLI
    "typer~=0.25.1",
    # Time / TZ / Market calendar
    "pendulum~=3.2.0",
    "pandas-market-calendars~=5.3.2",
    # Time series stats (Engle-Granger, ADF, etc)
    "statsmodels~=0.14.6",
]

[project.optional-dependencies]
dev = [
    # pytest 9.x 対応の pytest-asyncio がまだリリースされていないため pytest 8.x で統一.
    # 新版が出たらアップデート (ref: pytest-asyncio 1.1.1 は pytest<9 制約).
    "pytest~=8.4.0",
    "pytest-asyncio~=1.1.0",
    "pytest-cov~=7.1.0",
    "hypothesis~=6.152.4",
    "ruff~=0.15.12",
    "mypy~=1.20.2",
]
gui = [
    # marimo: reactive Python notebook (Jupyter 代替, git-friendly, app/edit 兼用)
    "marimo[recommended]~=0.23.4",
    # altair: declarative visualization
    "altair~=6.1.0",
    "pandas>=2.0",  # altair は pandas DataFrame を要求
]
audit = [
    # 外部ベンチマーク (SPY 等) の取得
    "yfinance~=1.3.0",
    # DuckDB の datetime 計算で必要
    "pytz>=2025.1",
]

[project.scripts]
diff-old-new = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# marimo notebook は dependency injection 引数 (大文字 dataclass や useless expression 表現) を多用するため除外
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "hyperliquid.*", "pendulum.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "slow: long-running tests (integration, end-to-end)",
    "live: tests that hit live HL API (skip in CI)",
]
